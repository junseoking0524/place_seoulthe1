name: place-rank

on:
  workflow_dispatch:
    inputs:
      keyword:
        description: "검색 키워드"
        required: true
        default: "판교통증의학과"
      max_pages:
        description: "최대 페이지 수 (시험은 2)"
        required: true
        default: "2"
  # 시험 실행이 성공하고 결과가 직접 검색과 같다고 확인된 뒤에만 아래 두 줄의 # 를 지운다.
  # schedule:
  #   - cron: "0 0 * * *"   # UTC 00:00 = 한국시간 09:00 (수 분~수십 분 지연될 수 있음)

jobs:
  run:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Run
        run: |
          mkdir -p out
          python naver_place_rank.py \
            --keyword "${{ inputs.keyword || '판교통증의학과' }}" \
            --max-pages "${{ inputs.max_pages || '58' }}" \
            --headless --debug \
            --out out/result.csv

      # 실행 화면의 Annotations로 결과 요약을 출력한다 (결과 파일을 내려받지 않고도 읽을 수 있게).
      - name: Report
        if: always()
        run: |
          python - <<'PY'
          import json, os

          def enc(s):
              return s.replace("%", "%25").replace("\r", "%0D").replace("\n", "%0A")

          def note(title, msg):
              print(f"::notice title={title}::{enc(msg)}")

          p_diag = "out/result.csv.diag.json"
          if os.path.exists(p_diag):
              d = json.load(open(p_diag, encoding="utf-8"))
              note("diag", "title=%s\nurl=%s\nname_count=%s\ncard_count=%s\nbody_head=%s"
                   % (d.get("title"), d.get("url"), d.get("name_count"), d.get("card_count"), d.get("body_head")))
              if d.get("card_html"):
                  note("first_card_html", d["card_html"])
          else:
              note("diag", "diag.json 없음 (수집 전에 중단됨)")

          p_csv = "out/result.csv"
          if os.path.exists(p_csv):
              note("result_csv", open(p_csv, encoding="utf-8-sig").read()[:6000])
          else:
              note("result_csv", "result.csv 없음")
          PY

      # 공개 저장소에 순위 데이터가 남지 않도록, 시험 단계에서는 커밋하지 않고
      # 실행 결과 화면의 Artifacts로만 내려받는다.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: place-rank-result
          path: out/
